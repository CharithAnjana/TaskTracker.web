<section class="vh-100">
  <div class="container py-5 h-100">
    <div class="row d-flex align-items-center justify-content-center h-100">
      <div class="col-md-8 col-lg-7 col-xl-6">
        <img src="assets/images/draw.png" class="img-fluid" alt="draw" />
      </div>
      <div class="col-md-7 col-lg-5 col-xl-5 offset-xl-1">
        <form class="form" [formGroup]="loginForm">
          <div class="d-grid gap-2 col-9 mx-auto">
            <h3 class="mb-5 text-center">Login</h3>

            <mat-form-field class="mb-2">
              <mat-label>Email address</mat-label>
              <input matInput formControlName="email" required />
              @if (loginForm.controls['email'].hasError('required')) {
              <mat-error>Email is required</mat-error>
              }
            </mat-form-field>

            <mat-form-field class="mb-2">
              <mat-label>Password</mat-label>
              <input
                matInput
                formControlName="password"
                [type]="hide() ? 'password' : 'text'"
              />
              @if (loginForm.controls['password'].hasError('required')) {
              <mat-error>Password is required</mat-error>
              }
              <button
                mat-icon-button
                matSuffix
                (click)="clickHide($event)"
                [attr.aria-label]="'Hide password'"
                [attr.aria-pressed]="hide()"
              >
                <mat-icon>{{
                  hide() ? "visibility_off" : "visibility"
                }}</mat-icon>
              </button>
            </mat-form-field>

            <div
              class="d-flex justify-content-around align-items-center mt-2 mb-4"
            >
              <div class="form-check">
                <input
                  class="form-check-input"
                  type="checkbox"
                  value=""
                  checked
                />
                <label class="form-check-label" for="form1Example3">
                  Remember me
                </label>
              </div>
              <a href="#!">Forgot password?</a>
            </div>

            <button
              type="button"
              class="btn btn-outline-primary"
              (click)="logIn()"
            >
              LogIn
            </button>
          </div>

          <div class="divider d-flex align-items-center my-4">
            <p class="text-center fw-bold mx-3 mb-0 text-muted">OR</p>
          </div>

          <div class="d-grid gap-2 col-9 mx-auto">
            <button class="btn btn-outline-facebook" type="button">
              <i class="fab fa-facebook-f me-2"></i>Continue with Facebook
            </button>
            <button class="btn btn-outline-google" type="button">
              <i class="fab fa-google me-2"></i>Continue with Google
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</section>
